name: Bug report
description: A patch doesn't work, signing in fails, or the app crashes.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please [search the existing issues](https://github.com/JoFSlash/booking-patches/issues?q=label%3Abug) first, and check [Known issues](https://github.com/JoFSlash/booking-patches#known-issues). Don't post your name, email, booking numbers or payment details.
  - type: input
    id: patch
    attributes:
      label: Patch
      description: The patch that misbehaves, by its name in Morphe Manager. Write "app crashes" or "sign-in" if you don't know which one.
      placeholder: Compare prices
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: What you expected, what happened instead, and how to get there (which screen, which city or hotel). Screenshots help, but hide your data.
    validations:
      required: true
  - type: dropdown
    id: app-version
    attributes:
      label: Booking.com version
      options:
        - "71.1"
        - Other (write it below)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Patches, Morphe Manager and Android versions
      description: Add the Booking.com version here if you picked "Other", and the MicroG-RE version if you use it.
      placeholder: "patches 1.1.0, Morphe Manager 1.20.0, Android 15, MicroG-RE 7.3.1"
    validations:
      required: true
  - type: input
    id: changed-patches
    attributes:
      label: Patches you turned on or off
      description: Optional. Only if you changed the defaults in Expert mode.
      placeholder: "Stays only on, Block tracking off"
  - type: input
    id: country
    attributes:
      label: Country you search from
      description: Optional. Prices, offers and messages differ by country.
      placeholder: Germany
  - type: textarea
    id: logs
    attributes:
      label: Crash log
      description: Optional. For crashes, the output of `adb logcat | grep -E "AndroidRuntime|JoFSlash"`.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you send
      options:
        - label: I searched the open and closed issues and this is not a duplicate.
          required: true
        - label: The problem is still there with the latest release of the patches.
          required: true
