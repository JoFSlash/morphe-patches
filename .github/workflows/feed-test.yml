name: Feed test

# Signs in to Quora with a test account in the patched app on an emulator and checks the page
# patches on the real feed and on an answer: the ask box is hidden, no promoted items, Copy and
# Share text buttons under answers, the bookmark button and the app's bookmark list.
#
# Runs once a day and by hand, not on pull requests (a sign-in on every push could get the test
# account locked). It needs these secrets:
#   QUORA_APKS_TOKEN     read access to JoFSlash/quora-apks (see emulator.yml)
#   QUORA_TEST_EMAIL     a Quora account made only for this test
#   QUORA_TEST_PASSWORD  its password
# Without them the test is skipped. When Quora asks for more than a password (a captcha or a
# code sent by email) the test is skipped with a notice instead of failing.
#
# The scripts are reached over WebView debugging, so this build adds one line that turns it on
# and leaves out "Disable WebView debugging". That build is only used here and is never released.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: feed-test
  cancel-in-progress: false

env:
  MORPHE_CLI_VERSION: 'v2.2.0'

jobs:
  feed:
    name: Feed with a test account
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.QUORA_APKS_TOKEN }}
          EMAIL: ${{ secrets.QUORA_TEST_EMAIL }}
          PASSWORD: ${{ secrets.QUORA_TEST_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::notice::QUORA_APKS_TOKEN, QUORA_TEST_EMAIL or QUORA_TEST_PASSWORD isn't set, so the feed test is skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup Java
        if: steps.secrets.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node
        if: steps.secrets.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Turn on WebView debugging for this test build
        if: steps.secrets.outputs.skip != 'true'
        run: |
          file=extensions/extension/src/main/java/app/jofslash/extension/quora/RemoveAdsPatch.java
          line='    public static void onPageFinished(WebView webView) {'
          grep -qF "$line" "$file" || { echo "::error::onPageFinished not found in RemoveAdsPatch.java"; exit 1; }
          sed -i "s|^$line\$|&\n        WebView.setWebContentsDebuggingEnabled(true); // feed test build only|" "$file"
          grep -c 'feed test build only' "$file"

      - name: Build
        if: steps.secrets.outputs.skip != 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Download Quora and the Morphe CLI
        if: steps.secrets.outputs.skip != 'true'
        env:
          APKS_TOKEN: ${{ secrets.QUORA_APKS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest version listed as supported in Constants.kt.
          QUORA_VERSION=$(grep -oE 'AppTarget\(version = "[0-9.]+"' patches/src/main/kotlin/app/jofslash/patches/quora/shared/Constants.kt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Quora $QUORA_VERSION"
          GH_TOKEN="$APKS_TOKEN" gh release download "quora-$QUORA_VERSION" -R JoFSlash/quora-apks \
            -p "quora-$QUORA_VERSION.apkm" -O "$RUNNER_TEMP/quora.apkm"
          gh release download "$MORPHE_CLI_VERSION" -R MorpheApp/morphe-cli -p 'morphe-desktop-*-all.jar' \
            -O "$RUNNER_TEMP/morphe-cli.jar"

      - name: Enable KVM
        if: steps.secrets.outputs.skip != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Patch, install, sign in and check the feed
        if: steps.secrets.outputs.skip != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QUORA_TEST_EMAIL: ${{ secrets.QUORA_TEST_EMAIL }}
          QUORA_TEST_PASSWORD: ${{ secrets.QUORA_TEST_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/check_quora_version.py "$RUNNER_TEMP/quora.apkm" --cli "$RUNNER_TEMP/morphe-cli.jar" --install --expect-login --exclude "Disable WebView debugging" --adb adb && node .github/scripts/feed-test.mjs
