name: Cronometer version

# Once a day, looks for a Cronometer version that this bundle doesn't support yet: app-version.yml
# does the work, with the settings in .github/apps/cronometer.json. Cronometer is set up "by hand"
# (source "hand"): the version is read from Google Play, or from APKPure's page when Google Play
# can't be read, and nothing is downloaded. Google Play only ships Cronometer as split APKs, and
# APKPure's latest endpoint only hands out the newest version, which since 4.57.4 starts through
# PairIP and can't be supported. So a new version opens one issue (once per version) instead of a
# download and a pull request every day. To try a version, add its split APKs to
# JoFSlash/morphe-apks as cronometer-<version> and run this workflow by hand with the version.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Cronometer version to try (empty: the newest on Google Play)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  version:
    uses: ./.github/workflows/app-version.yml
    secrets: inherit
    with:
      app: cronometer
      version: ${{ inputs.version || '' }}
